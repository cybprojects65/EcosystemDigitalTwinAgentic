<!DOCTYPE html>
<html>
<head>
    <title>Massaciuccoli Agent</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 70%; white-space: pre-wrap; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9e9eb; color: black; align-self: flex-start; }
        #input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #7aa7e0; cursor: not-allowed; }

        .bot ul { margin: 5px 0; padding-left: 20px; }
        .bot li { margin-bottom: 5px; }
        .bot p { margin: 5px 0; }
        .bot strong { color: #0056b3; } 

        /* Spinner animation */
        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <div id="chat-window">
        <div class="msg bot" id="welcome-msg"></div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message...">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');
        const sendBtn = document.getElementById('send-btn');

        // Welcome message
        const welcomeText = `**I am the Massaciuccoli Lake Basin Ecosystem Simulator**, a system designed to provide information and answers about the ecosystem of Lake Massaciuccoli.

I'm here to help you understand the ecosystem of the lake, its dynamics, and its characteristics. I can answer your questions based on my knowledge base, which is derived from various sources, including scientific articles and studies related to water management, environmental dynamics, and ecosystem aspects of Lake Massaciuccoli.

My main goal is to assist you in understanding the complex relationships within the lake's ecosystem and to provide insights that can help inform decisions about its management and conservation.

*You can chat in English or Italian.*`;

        document.getElementById('welcome-msg').innerHTML = marked.parse(welcomeText);

											 
        userInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message
            chatWindow.innerHTML += `<div class="msg user">${message}</div>`;
            userInput.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Disable input
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Add typing spinner bubble
            const spinnerId = "typing-indicator";
            chatWindow.innerHTML += `
                <div class="msg bot" id="${spinnerId}">
                    <div class="typing">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message})
                });

                const data = await response.json();

                // Remove spinner
                document.getElementById(spinnerId)?.remove();

                // Add formatted bot response
                const formattedResponse = marked.parse(data.response);
                chatWindow.innerHTML += `<div class="msg bot">${formattedResponse}</div>`;
                chatWindow.scrollTop = chatWindow.scrollHeight;

            } catch (error) {
                console.error('Error:', error);

                // Remove spinner
                document.getElementById(spinnerId)?.remove();

                chatWindow.innerHTML += `<div class="msg bot" style="color: red;">Error: Connection failed.</div>`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
